# Checks for every pull request and every push to main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  node:
    name: Node tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run test:node

  browser:
    name: In-browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.64.0
      - run: npx playwright install --with-deps chromium
      - run: node tools/test/run-browser-tests.mjs
      # Render parity: Sigma lays the example's library and pages out the same as its code renders them.
      - run: node tools/test/run-render-parity.mjs examples/css-app

  package:
    name: Standalone installed package (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # Pack the checkout, then install/launch it outside the checkout with no
      # optional native dependency. The smoke script uses only Node built-ins.
      - run: npm run test:package

  sigma:
    name: Sigma files match the code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # Every example project's Sigma files are valid, and their tokens and icons match the code.
      - run: |
          for project in examples/*/; do
            if [ -f "$project/sigma.config.json" ]; then
              echo "== $project"
              node bin/sigma-design.mjs check "$project"
            fi
          done

  architecture-prototype:
    name: Standalone architecture prototype
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: experiments/standalone-architecture
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - run: npm run test:layout
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  terminal-macos:
    name: Terminal lifecycle (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node --test tools/test/terminal.test.mjs
