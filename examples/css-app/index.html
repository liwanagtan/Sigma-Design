<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Projects – Acme</title>
  <link rel="stylesheet" href="src/styles/app.css">
</head>
<body>
  <script type="module">
    import { AppHeader } from './src/components/header.js';
    import { Input } from './src/components/input.js';
    import { Card } from './src/components/card.js';

    const projects = [
      ['Website', 'The marketing site: pages, blog and docs.'],
      ['Mobile app', 'iOS and Android, sharing the design tokens.'],
      ['Design system', 'Tokens, icons and components, kept in sync with Sigma.'],
    ];
    const main = Object.assign(document.createElement('main'), { className: 'page' });
    const grid = Object.assign(document.createElement('div'), { className: 'grid' });
    grid.append(...projects.map(([title, body]) => Card({ title, body, action: { label: 'Open' } })));
    main.append(Object.assign(document.createElement('h1'), { className: 'page__title', textContent: 'Projects' }), Input({ placeholder: 'Search projects' }), grid);
    document.body.append(AppHeader({ current: 'Projects', action: { label: 'New project', icon: 'actions/plus' } }), main);
  </script>
</body>
</html>
