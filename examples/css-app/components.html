<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <title>Acme components</title>
  <link rel="stylesheet" href="src/styles/app.css">
  <style>main { display: flex; flex-direction: column; align-items: flex-start; gap: 24px; padding: 24px; } .row { display: flex; gap: 16px; align-items: center; }</style>
</head>
<body>
  <!-- Each component rendered by itself, for people and for the Sigma sync skill to capture (like a Storybook). -->
  <main>
    <div class="row">
      <button class="button" id="button-primary"><svg data-sigma-name="Icon" class="icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M5 12h14" /><path d="m12 5 7 7-7 7" /></svg><span data-sigma-name="Label">Continue</span></button>
      <button class="button button--secondary" id="button-secondary"><svg data-sigma-name="Icon" class="icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M5 12h14" /><path d="m12 5 7 7-7 7" /></svg><span data-sigma-name="Label">Continue</span></button>
      <button class="button button--danger" id="button-danger"><svg data-sigma-name="Icon" class="icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M10 11v6" /><path d="M14 11v6" /><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" /><path d="M3 6h18" /><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" /></svg><span data-sigma-name="Label">Delete</span></button>
    </div>
    <input class="input" id="input" placeholder="Search projects" data-sigma-name="Input">
    <section class="card" id="card" style="width: 320px">
      <h2 class="card__title" data-sigma-name="Title">Acme</h2>
      <p class="card__body" data-sigma-name="Body">A small app whose design tokens live in src/styles/tokens.css.</p>
      <button class="button" data-sigma-name="Button"><span data-sigma-name="Label">Continue</span></button>
    </section>
  </main>
  <!-- Lets Sigma capture these components (Check against code): in an npm project, import 'sigma-design/bridge'. -->
  <script type="module" src="../../tools/capture/bridge.js"></script>
</body>
</html>
