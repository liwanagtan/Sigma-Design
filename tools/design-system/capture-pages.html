<!doctype html>
<meta charset="utf-8">
<title>Capture Sigma pages</title>
<style>body{font:14px system-ui;margin:24px}button{padding:12px}textarea{display:block;width:95%;height:200px;margin-top:16px}iframe{width:1280px;height:900px;border:1px solid #ddd;display:block;margin-top:20px}</style>
<h1>Capture Sigma’s built-in screens</h1>
<p>Captures only Welcome to Sigma files. Output contains editable UI layers and embedded SVG artwork.</p>
<button id="capture">Capture four screens</button>
<p id="status">Ready</p>
<textarea id="output" readonly aria-label="Captured pages JSON"></textarea>
<iframe id="preview" title="Sigma screen preview"></iframe>
<script type="module">
import { sigmaCapture } from '../capture/capture.js';
import { listFiles } from '../../src/files.js';
const frame = document.querySelector('iframe');
const status = document.querySelector('#status');
const wait = ms => new Promise(r => setTimeout(r, ms));
async function load(url, name) {
  await new Promise((resolve, reject) => { frame.onload = resolve; frame.onerror = reject; frame.src = url.replace('/#/', `/?capture-screen=${Date.now()}#/`); });
  const ready = () => {
    const doc = frame.contentDocument;
    if (name === 'Files home') return !doc.querySelector('#home')?.hidden && doc.querySelector('#home-files .file-card');
    if (name === 'Design editor') return !doc.querySelector('#app')?.hidden && doc.querySelector('#file-name')?.value === 'Components' && doc.querySelector('#world')?.children.length;
    const root = doc.querySelector(name === 'Tokens' ? '#tokens' : '#icons');
    return root && !root.hidden && root.querySelector('.file-name')?.value === name && root.querySelector(name === 'Tokens' ? '.vars-work' : '.icons-grid');
  };
  for (let i=0; i<150; i++) {
    if (ready()) {
      await frame.contentDocument.fonts.ready;
      await wait(500);
      if (ready()) return;
    }
    await wait(100);
  }
  throw new Error(`${name} did not load: refusing to capture a different screen.`);
}
// Keep viewport content; nested scroll regions retain clipping in the design file.
function prune(node, parentClip={ x:0,y:0,w:1280,h:900 }) {
  const b = node.box;
  if (!b || b.w <= 0 || b.h <= 0 || b.x+b.w <= parentClip.x || b.y+b.h <= parentClip.y || b.x >= parentClip.x+parentClip.w || b.y >= parentClip.y+parentClip.h) return null;
  const clips = /(auto|scroll|hidden)/.test(node.style?.overflow || '');
  const next = clips ? { x:Math.max(b.x,parentClip.x), y:Math.max(b.y,parentClip.y), w:Math.min(b.x+b.w,parentClip.x+parentClip.w)-Math.max(b.x,parentClip.x), h:Math.min(b.y+b.h,parentClip.y+parentClip.h)-Math.max(b.y,parentClip.y) } : parentClip;
  if (node.children) node.children = node.children.map(n=>prune(n,next)).filter(Boolean);
  return node;
}
document.querySelector('#capture').onclick = async () => {
  const button = document.querySelector('#capture'); button.disabled = true;
  try {
    // Boot the app and its Welcome migrations before resolving fixture IDs.
    await load('/#/', 'Files home');
    frame.contentDocument.querySelector('[data-section="welcome"]').click();
    for (let i=0; i<150 && frame.contentDocument.querySelector('#home-title')?.textContent !== 'Welcome to Sigma'; i++) await wait(100);
    const captures = [];
    for (const name of ['Files home', 'Design editor', 'Tokens', 'Icons']) {
      status.textContent = `Capturing ${name}…`;
      const targetName = name === 'Design editor' ? 'Components' : name;
      // Resolve each ID just before navigation; upgrades can replace built-in files.
      const file = name === 'Files home' ? null : (await listFiles()).find(m => m.name === targetName && (m.sample || m.welcome) && !m.archivedAt);
      if (name !== 'Files home' && !file) throw new Error(`Current Welcome file ${targetName} is missing.`);
      if (name !== 'Files home') await load(`/#/file/${file.id}`, name);
      const doc = frame.contentDocument;
      // Home updates its heading before asynchronous thumbnail/card rendering finishes.
      // Require the card/image snapshot to settle before taking its geometry.
      let previous = '', stable = 0;
      for (let attempt=0; attempt<100 && stable<5; attempt++) {
        const signature = [...doc.querySelectorAll('#home-files a, img')].map(el=>el.href || el.currentSrc || el.src).join('|');
        stable = signature === previous ? stable + 1 : 0; previous = signature;
        await wait(100);
      }
      // Fixtures always show Light, without changing the person's saved appearance.
      doc.documentElement.dataset.theme = 'light';
      doc.documentElement.dataset.appearance = 'light';
      frame.contentWindow.dispatchEvent(new frame.contentWindow.CustomEvent('sigma:appearance', { detail:'light' }));
      await new Promise(resolve => frame.contentWindow.requestAnimationFrame(() => frame.contentWindow.requestAnimationFrame(resolve)));
      doc.querySelectorAll('[data-appearance]').forEach(b=> {
        b.setAttribute('aria-label','Appearance: Light'); b.title='Appearance: Light';
        const text=b.querySelector('[data-appearance-label]'); if(text) text.textContent='Appearance: Light';
      });
      // Remove transient banners and toasts from the fixture, keeping the interface itself.
      doc.querySelectorAll('.file-banner, .toast').forEach(n=>n.remove());
      const capture = sigmaCapture(doc.body, { name });
      // Native select labels do not appear as text-node boxes in a browser capture.
      const selects = [...doc.querySelectorAll('select')].map(el=>({ box:el.getBoundingClientRect(), text:el.selectedOptions[0]?.textContent || '' }));
      const selectedText = n => {
        if (n.tag==='select') n.text = selects.find(s=>Math.abs(s.box.x-n.box.x)<1 && Math.abs(s.box.y-n.box.y)<1)?.text || '';
        (n.children || []).forEach(selectedText);
      };
      selectedText(capture.tree);
      capture.tree = prune(capture.tree);
      capture.url = name==='Files home' ? '/#/' : `/#/file/<${name.toLowerCase().replaceAll(' ','-')}>`;
      delete capture.capturedAt;
      const images = [...doc.querySelectorAll('img')];
      const imageData = new Map();
      for (const image of images) {
        try {
          const blob = await (await fetch(image.currentSrc || image.src)).blob();
          const data = await new Promise(resolve=> { const r = new FileReader(); r.onload=()=>resolve(r.result); r.readAsDataURL(blob); });
          imageData.set(new URL((image.currentSrc || image.src).replace(/^blob:/, ''), doc.baseURI).pathname, data);
        } catch {}
      }
      const inline = n => { if (n.tag==='img') { const key=new URL(n.src, doc.baseURI).pathname; if(imageData.has(key)) n.src=imageData.get(key); else throw new Error(`Could not embed image in ${name}: ${n.src}`); } (n.children||[]).forEach(inline); };
      inline(capture.tree);
      captures.push({ name, capture });
    }
    const css = await (await fetch('/styles.css')).text();
    const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(css));
    const sourceHash = [...new Uint8Array(digest)].map(n=>n.toString(16).padStart(2,'0')).join('');
    document.querySelector('#output').value = JSON.stringify({ sourceHash, captures });
    status.textContent = 'Done — four screens captured. Copy the JSON to work/sigma-pages-captures.json, then run npm run build:pages.';
  } catch (error) { status.textContent = error.message; }
  finally { button.disabled=false; }
};
</script>
