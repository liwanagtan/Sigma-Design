<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sigma: render parity</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body { font: 13px/1.5 Inter, system-ui, sans-serif; margin: 24px; } pre { white-space: pre-wrap; }</style>
</head>
<body>
  <!-- Render parity: capture every component library in sigma.config.json from its components page (as the code
       renders it), and compare Sigma's layout of each with the captures. Open with Sigma running on the project
       (npx sigma-design dev): http://localhost:<port>/tools/capture/parity.html. In CI:
       node tools/test/run-render-parity.mjs <project>. window.sigmaParity holds the result. -->
  <h1>Sigma vs. code</h1>
  <pre id="out">Starting…</pre>
  <script type="module">
    import { captureFromCode } from '../../src/capture-from-code.js';
    import { compareLibrary, comparePages, formatComparison } from '../../src/capture-compare.js';
    const out = document.getElementById('out');
    const status = (text) => (out.textContent = text);
    await document.fonts?.ready;
    try {
      const { config } = await (await fetch('/api/project', { cache: 'no-store' })).json();
      const entries = (config?.components || []).filter((e) => e.page);
      if (!entries.length) throw new Error('no component library in sigma.config.json has a components page ("page")');
      const lines = [];
      let drift = 0;
      for (const entry of entries) {
        const { dir, missing } = await captureFromCode(entry, status);
        status(`Comparing ${entry.sigma}…`);
        const components = await compareLibrary({ captures: dir });
        const pages = await comparePages({ captures: dir });
        drift += [...Object.values(components), ...Object.values(pages)].filter((d) => d.length).length + missing.length;
        lines.push(`${entry.sigma}`, formatComparison(components), ...(Object.keys(pages).length ? ['', 'Pages', formatComparison(pages)] : []),
          ...missing.map((m) => `✗ missing on the components page: ${m}`), '');
      }
      out.textContent = lines.join('\n');
      window.sigmaParity = { ok: drift === 0, drift, text: out.textContent };
    } catch (err) {
      out.textContent = `Couldn’t check render parity: ${err.message}`;
      window.sigmaParity = { ok: false, error: err.message, text: out.textContent };
    }
  </script>
</body>
</html>
