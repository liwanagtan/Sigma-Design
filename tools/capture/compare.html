<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sigma: compare the library with the code</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body { font: 13px/1.5 Inter, system-ui, sans-serif; margin: 24px; } pre { white-space: pre-wrap; }</style>
</head>
<body>
  <!-- Open with Sigma's server running on the project (python3 serve.py --project PATH):
       http://localhost:<port>/tools/capture/compare.html[?captures=.sigma/captures] -->
  <h1>Library vs. code</h1>
  <pre id="out">Comparing…</pre>
  <script type="module">
    import { compareLibrary, formatComparison } from '../../src/capture-compare.js';
    const captures = new URLSearchParams(location.search).get('captures') || '.sigma/captures';
    await document.fonts?.ready;
    try {
      const report = await compareLibrary({ captures });
      document.getElementById('out').textContent = formatComparison(report);
      window.sigmaComparison = report;
    } catch (err) {
      document.getElementById('out').textContent = `Couldn’t compare: ${err.message}`;
    }
  </script>
</body>
</html>
